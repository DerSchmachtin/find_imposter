<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#222222">
    <title>Bouncende Gesichter - Finde den Imposter!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128373;</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="header">
        <h1>Finde den Imposter!</h1>
        <div id="hud">
            <span id="score" role="status">Score: 0</span>
            <span id="timer">Zeit: 30s</span>
        </div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h2 id="overlay-title">Finde den Imposter!</h2>
            <p id="overlay-text">Unter lauter Martins versteckt sich genau ein Chris. Klick ihn an, bevor die Zeit abläuft.</p>
            <p id="overlay-best"></p>
            <button id="overlay-button" type="button" disabled>Lade Gesichter …</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
